services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: ownlish-${OWNLISH_ENV}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app

  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    container_name: ownlish-${OWNLISH_ENV}-server
    restart: unless-stopped
    env_file:
      - ${OWNLISH_ENV_FILE}
    environment:
      NODE_ENV: production
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
      - edge

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_TOEIC_CATALOG_ROOT: ${NEXT_PUBLIC_TOEIC_CATALOG_ROOT}
        NEXT_PUBLIC_DICTATION_CATALOG_ROOT: ${NEXT_PUBLIC_DICTATION_CATALOG_ROOT}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    container_name: ownlish-${OWNLISH_ENV}-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_API_BASE_URL: ${AUTH_API_BASE_URL}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    depends_on:
      server:
        condition: service_started
    networks:
      - edge

volumes:
  postgres_data:
    name: ownlish-${OWNLISH_ENV}-postgres-data

networks:
  app:
    internal: true
  edge:
    external: true
    name: ownlish-edge
