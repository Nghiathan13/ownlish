name: Web CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Run tests
        id: vitest
        run: |
          mkdir -p test-results
          pnpm test --reporter=default --reporter=json --outputFile.json=test-results/vitest.json

      - name: Run lint
        id: lint
        run: pnpm lint

      - name: Build
        id: build
        run: pnpm build

      - name: Publish test summary
        if: always()
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Web CI summary"
            echo
            echo "| Test suite | Files | Total | Passed | Failed | Skipped / todo | Status |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | --- |"

            if [[ -f test-results/vitest.json ]] && jq -e . test-results/vitest.json >/dev/null 2>&1; then
              files=$(jq -r '.testResults | length' test-results/vitest.json)
              total=$(jq -r '.numTotalTests // 0' test-results/vitest.json)
              passed=$(jq -r '.numPassedTests // 0' test-results/vitest.json)
              failed=$(jq -r '.numFailedTests // 0' test-results/vitest.json)
              pending=$(jq -r '.numPendingTests // 0' test-results/vitest.json)
              todo=$(jq -r '.numTodoTests // 0' test-results/vitest.json)
              echo "| Vitest | ${files} | ${total} | ${passed} | ${failed} | ${pending} / ${todo} | ${VITEST_OUTCOME} |"
            else
              echo "| Vitest | — | — | — | — | — | report unavailable (${VITEST_OUTCOME}) |"
            fi

            echo
            echo "| Quality gate | Status |"
            echo "| --- | --- |"
            echo "| Lint | ${LINT_OUTCOME} |"
            echo "| Build | ${BUILD_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ownlish
          POSTGRES_PASSWORD: ownlish
          POSTGRES_DB: ownlish_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownlish -d ownlish_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://ownlish:ownlish@localhost:5432/ownlish_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        id: playwright
        run: pnpm test:e2e

      - name: Publish test summary
        if: always()
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          {
            echo "## Browser E2E summary"
            echo
            echo "| Test suite | Unique specs | Passed | Failed | Skipped | Flaky | Retry attempts | Status |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |"

            if [[ -f test-results/playwright.json ]] && jq -e . test-results/playwright.json >/dev/null 2>&1; then
              specs=$(jq '[.. | objects | .specs? // empty | .[]?] | length' test-results/playwright.json)
              passed=$(jq -r '.stats.expected // 0' test-results/playwright.json)
              failed=$(jq -r '.stats.unexpected // 0' test-results/playwright.json)
              skipped=$(jq -r '.stats.skipped // 0' test-results/playwright.json)
              flaky=$(jq -r '.stats.flaky // 0' test-results/playwright.json)
              retries=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.retry > 0)] | length' test-results/playwright.json)
              echo "| Playwright | ${specs} | ${passed} | ${failed} | ${skipped} | ${flaky} | ${retries} | ${PLAYWRIGHT_OUTCOME} |"
            else
              echo "| Playwright | — | — | — | — | — | — | report unavailable (${PLAYWRIGHT_OUTCOME}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse
        run: pnpm lighthouse

      - name: Write Lighthouse summary
        if: always()
        run: pnpm lighthouse:summary

      - name: Assert Lighthouse budgets
        run: pnpm lighthouse:assert

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  lighthouse-desktop:
    name: Lighthouse Desktop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse desktop
        run: pnpm lighthouse:desktop

      - name: Write Lighthouse desktop summary
        if: always()
        run: pnpm lighthouse:desktop:summary

      - name: Assert Lighthouse desktop budgets
        run: pnpm lighthouse:desktop:assert

      - name: Upload Lighthouse desktop reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-desktop-reports
          path: apps/web/.lighthouseci-desktop
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7

  lighthouse-authenticated:
    name: Lighthouse Authenticated (${{ matrix.profile }})
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mobile
            command: lighthouse:authenticated
            summary_command: lighthouse:authenticated:summary
            assert_command: lighthouse:authenticated:assert
            artifact: lighthouse-authenticated-reports
            report_directory: .lighthouseci-authenticated
          - profile: desktop
            command: lighthouse:authenticated:desktop
            summary_command: lighthouse:authenticated:desktop:summary
            assert_command: lighthouse:authenticated:desktop:assert
            artifact: lighthouse-authenticated-desktop-reports
            report_directory: .lighthouseci-authenticated-desktop

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ownlish
          POSTGRES_PASSWORD: ownlish
          POSTGRES_DB: ownlish_lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ownlish -d ownlish_lighthouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LIGHTHOUSE_DATABASE_URL: postgresql://ownlish:ownlish@localhost:5432/ownlish_lighthouse
      LIGHTHOUSE_AUTH_EMAIL: performance-benchmark-vu-01@ownlish.local
      LIGHTHOUSE_AUTH_PASSWORD: performance-benchmark-password
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3101
      AUTH_API_BASE_URL: http://localhost:3101
      NEXT_PUBLIC_TOEIC_CATALOG_ROOT: http://localhost:3100/toeic
      NEXT_PUBLIC_DICTATION_CATALOG_ROOT: http://localhost:3100/dictation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Migrate, seed, and start API
        working-directory: apps/server
        env:
          DATABASE_URL: ${{ env.LIGHTHOUSE_DATABASE_URL }}
          PERFORMANCE_DATABASE_URL: ${{ env.LIGHTHOUSE_DATABASE_URL }}
          NODE_ENV: test
          JWT_SECRET: lighthouse-jwt-secret-at-least-32-characters
          PORT: 3101
          CORS_ORIGIN: http://localhost:3100
          BCRYPT_SALT_ROUNDS: 4
          AUTH_RATE_LIMIT_LIMIT: 100
          AUTH_RATE_LIMIT_TTL_SECONDS: 60
          REFRESH_TOKEN_COOKIE_SECURE: "false"
          REFRESH_TOKEN_COOKIE_SAME_SITE: lax
          GOOGLE_CLIENT_ID: ""
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
          pnpm lighthouse:seed
          pnpm build
          pnpm start:prod > ../../lighthouse-api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3101/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ../../lighthouse-api.log
          exit 1

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Run Lighthouse authenticated audit
        working-directory: apps/web
        run: pnpm ${{ matrix.command }}

      - name: Write Lighthouse authenticated summary
        if: always()
        working-directory: apps/web
        run: pnpm ${{ matrix.summary_command }}

      - name: Assert Lighthouse authenticated budgets
        working-directory: apps/web
        run: pnpm ${{ matrix.assert_command }}

      - name: Upload Lighthouse authenticated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/web/${{ matrix.report_directory }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
