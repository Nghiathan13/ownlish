services:
  postgres:
    image: postgres:16-alpine
    container_name: ownlish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ownlish
      POSTGRES_PASSWORD: ownlish
      POSTGRES_DB: ownlish
    ports:
      - '5433:5432'
    volumes:
      - ownlish_postgres_data:/var/lib/postgresql/data

volumes:
  ownlish_postgres_data:
