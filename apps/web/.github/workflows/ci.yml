name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        id: vitest
        run: |
          mkdir -p test-results
          pnpm test --reporter=default --reporter=json --outputFile.json=test-results/vitest.json

      - name: Run lint
        id: lint
        run: pnpm lint

      - name: Build
        id: build
        run: pnpm build

      - name: Publish test summary
        if: always()
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Web CI summary"
            echo
            echo "| Test suite | Files | Total | Passed | Failed | Skipped / todo | Status |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | --- |"

            if [[ -f test-results/vitest.json ]] && jq -e . test-results/vitest.json >/dev/null 2>&1; then
              files=$(jq -r '.testResults | length' test-results/vitest.json)
              total=$(jq -r '.numTotalTests // 0' test-results/vitest.json)
              passed=$(jq -r '.numPassedTests // 0' test-results/vitest.json)
              failed=$(jq -r '.numFailedTests // 0' test-results/vitest.json)
              pending=$(jq -r '.numPendingTests // 0' test-results/vitest.json)
              todo=$(jq -r '.numTodoTests // 0' test-results/vitest.json)
              echo "| Vitest | ${files} | ${total} | ${passed} | ${failed} | ${pending} / ${todo} | ${VITEST_OUTCOME} |"
            else
              echo "| Vitest | — | — | — | — | — | report unavailable (${VITEST_OUTCOME}) |"
            fi

            echo
            echo "| Quality gate | Status |"
            echo "| --- | --- |"
            echo "| Lint | ${LINT_OUTCOME} |"
            echo "| Build | ${BUILD_OUTCOME} |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: engvocab
          POSTGRES_PASSWORD: engvocab
          POSTGRES_DB: engvocab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engvocab -d engvocab_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgresql://engvocab:engvocab@localhost:5432/engvocab_e2e

    steps:
      - name: Checkout web
        uses: actions/checkout@v4
        with:
          path: engvocab-web

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: Nghiathan13/engvocab-server
          path: engvocab-server

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            engvocab-web/pnpm-lock.yaml
            engvocab-server/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: engvocab-web
        run: pnpm install --frozen-lockfile

      - name: Install API dependencies
        working-directory: engvocab-server
        run: pnpm install --frozen-lockfile --strict-peer-dependencies=false

      - name: Install Chromium
        working-directory: engvocab-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E
        id: playwright
        working-directory: engvocab-web
        run: pnpm test:e2e

      - name: Publish test summary
        if: always()
        working-directory: engvocab-web
        env:
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: |
          {
            echo "## Browser E2E summary"
            echo
            echo "| Test suite | Unique specs | Passed | Failed | Skipped | Flaky | Retry attempts | Status |"
            echo "| --- | ---: | ---: | ---: | ---: | ---: | ---: | --- |"

            if [[ -f test-results/playwright.json ]] && jq -e . test-results/playwright.json >/dev/null 2>&1; then
              specs=$(jq '[.. | objects | .specs? // empty | .[]?] | length' test-results/playwright.json)
              passed=$(jq -r '.stats.expected // 0' test-results/playwright.json)
              failed=$(jq -r '.stats.unexpected // 0' test-results/playwright.json)
              skipped=$(jq -r '.stats.skipped // 0' test-results/playwright.json)
              flaky=$(jq -r '.stats.flaky // 0' test-results/playwright.json)
              retries=$(jq '[.. | objects | select(has("results")) | .results[]? | select(.retry > 0)] | length' test-results/playwright.json)
              echo "| Playwright | ${specs} | ${passed} | ${failed} | ${skipped} | ${flaky} | ${retries} | ${PLAYWRIGHT_OUTCOME} |"
            else
              echo "| Playwright | — | — | — | — | — | — | report unavailable (${PLAYWRIGHT_OUTCOME}) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            engvocab-web/playwright-report
            engvocab-web/test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run Lighthouse
        run: pnpm lighthouse

      - name: Write Lighthouse summary
        if: always()
        run: pnpm lighthouse:summary

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
