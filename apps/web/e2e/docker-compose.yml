services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engvocab
      POSTGRES_PASSWORD: engvocab
      POSTGRES_DB: engvocab_e2e
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engvocab -d engvocab_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
